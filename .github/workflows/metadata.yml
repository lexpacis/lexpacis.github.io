name: Lexpacis 云端采集与发布
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/metadata.yml'
      - 'config/**'
      - 'scripts/**'
      - 'web/**'
      - 'dist/data.json'
  workflow_dispatch:
  schedule:
    # UTC 01:17 / 05:17 / 10:17 / 14:17 = Asia/Shanghai 09:17 / 13:17 / 18:17 / 22:17.
    # GitHub runs scheduled jobs on a best-effort basis and can delay or drop a slot;
    # the extra midday and late slots keep a missed run from leaving the site stale for a day.
    - cron: '17 1,5,10,14 * * *'
permissions:
  contents: read
concurrency:
  group: lexatlas-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # official v6, checked 2026-11-18
        with:
          persist-credentials: false
      - name: Check supported runtime
        run: python3 -c 'import sys; assert sys.version_info >= (3,10)'
      - name: Ensure the Ubuntu PDF reader is available
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get -q -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update ||
              sudo apt-get -q -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
            sudo apt-get -q -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install --no-install-recommends -y poppler-utils ||
              echo "::warning::PDF reader unavailable this run; PDF-only entries stay unpublished and recover on the next run."
          fi
          command -v prlimit
      - name: Verify pipeline and public artifacts
        run: python3 -m unittest discover -s tests -q
      - name: Collect and build without any model
        run: python3 scripts/cloud.py run
      - name: Preserve only public metadata for the next run
        # The snapshot commit can fail on its own (protected branch, token scope,
        # a concurrent push). The build is already validated at this point, so a
        # failed commit must not block the deploy: the next run simply restores
        # the previous snapshot and collects again.
        continue-on-error: true
        run: python3 scripts/cloud.py commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload public website artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # official v4
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # official v4, checked 2026-11-18
